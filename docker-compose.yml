version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: signal
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
    ports:
      # Host 5432 is often taken by a native postgres install; loopback
      # connections would silently hit that instead of this container.
      - "${PG_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Builds the SAME image the deployment uses. It used to build
    # `./backend`, whose CMD is a bare uvicorn, and then override the command
    # here as well — so `scripts/boot.sh`, the only thing that applies the
    # schema and loads the committed seed, never ran under compose. A fresh
    # clone therefore came up with 0 sessions and 0 cards while the README
    # said data ships with it. One image, one boot path, no second place for
    # seed logic to live.
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/data
      # Signal Lab reads these at request time instead of embedding numbers in
      # its template. The deployment image COPYs them; compose mounts them so a
      # regenerated benchmark shows up without a rebuild.
      - ./results:/results:ro
      - ./ops:/ops:ro
    # No command override: the image's CMD is boot.sh. RELOAD keeps the
    # dev ergonomics the override was there for.
    environment:
      DATABASE_URL: postgresql://signal:signal@db:5432/signal
      RELOAD: "1"

volumes:
  pg_data:
